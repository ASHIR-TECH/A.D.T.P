[workspace]
members = [
    "crates/adtp-core",
    "crates/adtp-client",
    "crates/adtp-server",
    "crates/adtp-cli",
    "crates/adtp-proto",
    "desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
quinn = { version = "0.11", features = ["rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
aes-gcm = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
bytes = "1"
prost = "0.12"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
async-trait = "0.1"
hex = "0.4"
rcgen = "0.13"
notify = { version = "6", features = ["macos_fsevent"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-util = { version = "0.7", features = ["codec"] }
dashmap = "5"
flume = "0.11"
dirs = "5"
walkdir = "2"
infer = "0.15"
notify-rust = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
