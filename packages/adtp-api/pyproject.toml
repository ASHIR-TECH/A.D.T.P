[project]
name = "adtp-api"
version = "0.1.0"
description = "ADTP REST API — Phase 4"
requires-python = ">=3.12"
authors = [{ name = "ASHIR Tech" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "adtp-mcp @ file:///home/contractor/Koding/A.D.T.P/packages/adtp-mcp",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
]
# Real CPU/RAM/battery readings for /api/v1/system/info. Everything degrades to
# null without it (the service falls back to /proc, ctypes and sysctl), so this
# is an enhancement, not a requirement.
metrics = [
    "psutil>=5.9",
]

[project.scripts]
adtp-api = "adtp_api.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
