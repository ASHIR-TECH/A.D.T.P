[project]
name = "adtp-mcp"
version = "0.1.0"
description = "ADTP MCP server bridge for Rust daemons"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ASHIR Tech" }]
dependencies = [
    "mcp>=1.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
adtp-mcp = "adtp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
