name: Build ADTP

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --libs glib-2.0
      - uses: Swatinem/rust-cache@v2
      - name: Purge stale glib-sys build artifacts from cache
        run: |
          rm -rf target/debug/build/glib-sys-* target/debug/build/glib-*
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p adtp-cli --release
      - run: cargo test -p adtp-cli --release
      - name: Upload CLI binary (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: adtp-cli-linux
          path: target/release/adtp

  build-desktop:
    name: Desktop (${{ matrix.name }})
    needs: [lint, test-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundle-args: --bundles deb,appimage
            cli-binary: adtp
            cli-artifact: adtp-cli-linux
            desktop-artifact: adtp-desktop-linux
          - name: Windows
            os: windows-2025
            bundle-args: --bundles msi
            cli-binary: adtp.exe
            cli-artifact: adtp-cli-windows
            desktop-artifact: adtp-desktop-windows
          - name: macOS
            os: macos-14
            bundle-args: --bundles dmg
            cli-binary: adtp
            cli-artifact: adtp-cli-macos
            desktop-artifact: adtp-desktop-macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux-specific setup
      - name: Install Tauri system deps
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
          libappindicator3-dev librsvg2-dev libssl-dev patchelf \
          libayatana-appindicator3-dev
          pkg-config --libs --cflags glib-2.0

      - name: Clear stale glib-sys cache
        if: matrix.name == 'Linux'
        run: rm -rf target/debug/build/glib-* target/release/build/glib-*; ls target/debug/build/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo build -p adtp-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli-artifact }}
          path: target/release/${{ matrix.cli-binary }}

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build ${{ matrix.bundle-args }}
        working-directory: desktop/src-tauri

      - name: Upload desktop installer (Linux)
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload desktop installer (Windows)
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact }}
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload desktop installer (macOS)
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release
          for platform in linux windows macos; do
            folder="adtp-${platform}"
            mkdir -p "release/$folder"
            cp artifacts/adtp-cli-${platform}/* "release/$folder/" 2>/dev/null || true
            cp artifacts/adtp-desktop-${platform}/* "release/$folder/" 2>/dev/null || true
          done
          cd release
          tar czf adtp-linux-x86_64.tar.gz adtp-linux
          zip -rq adtp-windows-x86_64.zip adtp-windows
          zip -rq adtp-macos-aarch64.zip adtp-macos
          rm -rf adtp-linux adtp-windows adtp-macos

      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          ## ADTP Desktop & CLI

          ### Downloads

          | Platform | Contents |
          |----------|----------|
          | Linux (x86_64) | CLI, .deb (Debian), .AppImage |
          | Windows (x86_64) | CLI (adtp.exe), .msi installer |
          | macOS (aarch64) | CLI, .dmg |

          ### Usage
          \`\`\`
          adtp send <file>        # send a file
          adtp status             # check transfer status
          adtp peer list          # list peers
          adtp desktop            # launch desktop GUI
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADTP ${{ github.ref_ref_name }}
          body_path: release-notes.md
          files: release/*.tar.gz release/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_ref_key, 'beta') }
