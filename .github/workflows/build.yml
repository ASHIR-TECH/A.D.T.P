name: Build ADTP

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p adtp-cli --release
      - run: cargo test -p adtp-cli --release
      - name: Upload CLI binary (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: adtp-cli-linux
          path: target/release/adtp

  build-desktop:
    name: Desktop (${{ matrix.name }})
    needs: [lint, test-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            tauri-target: linux
            bundle-args: --bundles deb,appimage
            cli-binary: adtp
            cli-artifact-name: adtp-cli-linux
            desktop-artifact-name: adtp-desktop-linux

          - name: Windows
            os: windows-2025
            tauri-target: windows
            bundle-args: --bundles msi
            cli-binary: adtp.exe
            cli-artifact-name: adtp-cli-windows
            desktop-artifact-name: adtp-desktop-windows

          - name: macOS
            os: macos-14
            tauri-target: macos
            bundle-args: --bundles dmg
            cli-binary: adtp
            cli-artifact-name: adtp-cli-macos
            desktop-artifact-name: adtp-desktop-macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri dependencies
        if: matrix.tauri-target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgraphene-1.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Build CLI binary
        run: cargo build -p adtp-cli --release

      - name: Upload CLI binary (per-platform)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli-artifact-name }}
          path: target/release/${{ matrix.cli-binary }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build Tauri desktop app
        working-directory: desktop/src-tauri
        run: cargo tauri build ${{ matrix.bundle-args }}

      - name: Upload desktop installer (Linux)
        if: matrix.tauri-target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload desktop installer (Windows)
        if: matrix.tauri-target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact-name }}
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload desktop installer (macOS)
        if: matrix.tauri-target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop-artifact-name }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archive structure
        run: |
          mkdir -p release

          # Linux
          mkdir -p release/adtp-linux-x86_64
          cp artifacts/adtp-cli-linux/adtp release/adtp-linux-x86_64/
          find artifacts/adtp-desktop-linux -type f -exec cp {} release/adtp-linux-x86_64/ \;

          # Windows
          mkdir -p release/adtp-windows-x86_64
          cp artifacts/adtp-cli-windows/adtp.exe release/adtp-windows-x86_64/
          find artifacts/adtp-desktop-windows -type f -exec cp {} release/adtp-windows-x86_64/ \;

          # macOS
          mkdir -p release/adtp-macos-aarch64
          cp artifacts/adtp-cli-macos/adtp release/adtp-macos-aarch64/
          find artifacts/adtp-desktop-macos -type f -exec cp {} release/adtp-macos-aarch64/ \;

      - name: Create release archives
        run: |
          cd release
          for dir in adtp-*; do
            if [ "$dir" = "adtp-linux-x86_64" ]; then
              tar czf "${dir}.tar.gz" "$dir"
            else
              zip -r "${dir}.zip" "$dir"
            fi
            rm -rf "$dir"
          done

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EONOTES'
          ## ADTP Desktop & CLI

          ### Downloads

          | Platform | Package | CLI Binary |
          |----------|---------|------------|
          | Linux (x86_64) | .deb / .AppImage | adtp (in archive) |
          | Windows (x86_64) | .msi | adtp.exe (in archive) |
          | macOS (Apple Silicon) | .dmg | adtp (in archive) |

          ### Usage
          ```
          adtp send <file>              # send a file
          adtp status                   # check transfer status
          adtp peer list                # list peers
          adtp desktop                  # launch desktop GUI from CLI
          adtp                          # enter REPL mode
          ```
          EONOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADTP ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/*.tar.gz
            release/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
