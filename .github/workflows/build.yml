name: Build ADTP

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clear stale glib cache
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-*
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p adtp-cli --release
      - run: cargo test -p adtp-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: target/release/adtp

  build-desktop:
    name: Desktop ${{ matrix.suffix }}
    needs: [lint, test-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: Linux
            os: ubuntu-24.04
            bundle: --bundles deb,appimage,rpm
          - suffix: Windows
            os: windows-2025
            bundle: --bundles msi
          - suffix: macOS
            os: macos-14
            bundle: --bundles dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        if: matrix.suffix == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            librsvg2-dev libssl-dev patchelf \
            libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2

      - name: Clear stale glib cache
        if: matrix.suffix == 'Linux'
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-* target/release/build/glib-sys-* target/release/build/glib-*

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo build -p adtp-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: adtp-cli-${{ matrix.suffix }}
          path: target/release/${{ matrix.suffix == 'Windows' && 'adtp.exe' || 'adtp' }}

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build ${{ matrix.bundle }}
        working-directory: desktop/src-tauri

      - name: Upload installers
        if: matrix.suffix == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installers-Linux
          path: desktop/src-tauri/target/release/bundle/*/*.{deb,AppImage,rpm}

      - name: Upload Windows installer
        if: matrix.suffix == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-Windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS installer
        if: matrix.suffix == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          ## ADTP Desktop & CLI

          ### Downloads

          **Linux**
          - [ADTP Desktop (.deb)](adtp-linux-x86_64.deb)
          - [ADTP Desktop (.rpm)](adtp-linux-x86_64.rpm)
          - [ADTP Desktop (AppImage)](adtp-linux-x86_64.AppImage)
          - [ADTP CLI (Linux)](adtp-cli-linux-x86_64)

          **Windows**
          - [ADTP Desktop (.msi)](adtp-windows-x86_64.msi)
          - [ADTP CLI (Windows)](adtp-cli-windows-x86_64.exe)

          **macOS**
          - [ADTP Desktop (.dmg)](adtp-macos-aarch64.dmg)
          - [ADTP CLI (macOS)](adtp-cli-macos-aarch64)

          ### Quick Start
          ```
          adtp send <file>     # send a file
          adtp status          # check transfer status
          adtp peer list       # list peers
          adtp desktop         # launch desktop GUI
          adtp                 # enter REPL mode
          ```
          EOF

      - name: Prepare release files
        run: |
          mkdir -p release
          # Linux installers
          find artifacts/adtp-installers-Linux -name "*.deb" -exec cp {} release/adtp-linux-x86_64.deb \;
          find artifacts/adtp-installers-Linux -name "*.rpm" -exec cp {} release/adtp-linux-x86_64.rpm \;
          find artifacts/adtp-installers-Linux -name "*.AppImage" -exec cp {} release/adtp-linux-x86_64.AppImage \;
          # Linux CLI
          cp artifacts/adtp-cli-Linux/adtp release/adtp-cli-linux-x86_64
          # Windows
          find artifacts/adtp-installer-Windows -name "*.msi" -exec cp {} release/adtp-windows-x86_64.msi \;
          cp artifacts/adtp-cli-Windows/adtp.exe release/adtp-cli-windows-x86_64.exe
          # macOS
          find artifacts/adtp-installer-macOS -name "*.dmg" -exec cp {} release/adtp-macos-aarch64.dmg \;
          cp artifacts/adtp-cli-macOS/adtp release/adtp-cli-macos-aarch64
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADTP ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
