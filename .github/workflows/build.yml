name: Build ADTP

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clear stale glib cache
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-*
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p adtp-cli --release
      - run: cargo test -p adtp-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: target/release/adtp

  build-desktop:
    name: Desktop ${{ matrix.suffix }}
    needs: [lint, test-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: Linux
            os: ubuntu-24.04
            bundle: --bundles deb,appimage,rpm
          - suffix: Windows
            os: windows-2025
            bundle: --bundles msi
          - suffix: macOS
            os: macos-14
            bundle: --bundles dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        if: matrix.suffix == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            librsvg2-dev libssl-dev patchelf \
            libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2

      - name: Clear stale glib cache
        if: matrix.suffix == 'Linux'
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-* target/release/build/glib-sys-* target/release/build/glib-*

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build ${{ matrix.bundle }}
        working-directory: desktop/src-tauri

      - name: Upload installers
        if: matrix.suffix == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installers-Linux
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn

      - name: Upload Windows installer
        if: matrix.suffix == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-Windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS installer
        if: matrix.suffix == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          ## ADTP Desktop

          ### Downloads

          Attached to this release (scroll down):

          **Linux**
          - ADTP Desktop (.deb)
          - ADTP Desktop (.rpm)
          - ADTP Desktop (AppImage)

          **Windows**
          - ADTP Desktop (.msi)

          **macOS**
          - ADTP Desktop (.dmg)
          EOF

      - name: Prepare release files
        run: |
          mkdir -p release
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f 2>/dev/null | head -30
          # Linux
          cp artifacts/adtp-installers-Linux/deb/*.deb release/ 2>/dev/null || echo "No .deb found"
          cp artifacts/adtp-installers-Linux/appimage/*.AppImage release/ 2>/dev/null || echo "No .AppImage found"
          cp artifacts/adtp-installers-Linux/rpm/*.rpm release/ 2>/dev/null || echo "No .rpm found"
          # Windows
          cp artifacts/adtp-installer-Windows/msi/*.msi release/ 2>/dev/null || echo "No .msi found"
          # macOS
          cp artifacts/adtp-installer-macOS/dmg/*.dmg release/ 2>/dev/null || echo "No .dmg found"
          echo "=== Release files ==="
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADTP ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
