name: Build & Release ADTP

on:
  push:
    branches: [main, Phase-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write
  security-events: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────
  lint:
    name: Lint & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. Run unit / integration tests ───────────────────────────────────
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

  # ── 3. Dependency & vulnerability audit ───────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Rust dependencies)
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2024-0429 \
            --ignore spin \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0194 || true

  # ── 4. Build Linux desktop binary ─────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop

      - name: Strip and package binary
        run: |
          strip target/release/adtp-desktop
          mkdir -p dist/linux
          cp target/release/adtp-desktop dist/linux/adtp-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: adtp-binary-linux
          path: dist/linux/adtp-desktop

  # ── 5. Build Windows desktop binary ───────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop

      - name: Package binary
        run: |
          mkdir -p dist/windows
          cp target/release/adtp-desktop.exe dist/windows/adtp-desktop.exe

      - uses: actions/upload-artifact@v4
        with:
          name: adtp-binary-windows
          path: dist/windows/adtp-desktop.exe

  # ── 6. Create a GitHub Release for this commit ────────────────────────
  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release files
        run: |
          echo "=== Artifacts directory ==="
          find artifacts -type f 2>/dev/null || echo "No artifacts found"
          mkdir -p release
          cp artifacts/adtp-desktop release/ 2>/dev/null || true
          cp artifacts/adtp-desktop.exe release/ 2>/dev/null || true
          echo "=== Release files ==="
          ls -lh release/

      - name: Create release tag for this commit
        id: tag
        run: |
          TAG="build-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          # ADTP Build — ${{ github.sha }}

          Built from branch **${{ github.ref_name }}**.

          ## Commit
          ${{ github.event.head_commit.message }}

          Author: ${{ github.event.head_commit.author.name }}

          ## Assets

          **Linux**
          - ADTP Desktop binary

          **Windows**
          - ADTP Desktop binary (.exe)

          > Automated release created by the Build & Release workflow on every push.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ADTP Build ${{ github.sha }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: true
          generate_release_notes: false
