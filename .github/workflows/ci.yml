name: Build & Release ADTP

on:
  push:
    branches: [main, Phase-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write
  security-events: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────
  lint:
    name: Lint & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. Run unit / integration tests ───────────────────────────────────
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

  # ── 3. Dependency & vulnerability audit ───────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Rust dependencies)
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2024-0429 \
            --ignore spin \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0194 || true

  # ── 4. Build Linux .deb package ─────────────────────────────────────────
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev \
            dpkg-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop

      - name: Package as .deb
        run: |
          set -e
          PKG_NAME="adtp-desktop"
          PKG_VERSION="1.0.0"
          PKG_ARCH="amd64"
          PKG_DIR="dist/linux-deb"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"

          # Copy binary
          cp target/release/adtp-desktop "$PKG_DIR/usr/bin/$PKG_NAME"
          chmod 755 "$PKG_DIR/usr/bin/$PKG_NAME"

          # Control file
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
Package: $PKG_NAME
Version: $PKG_VERSION
Section: net
Priority: optional
Architecture: $PKG_ARCH
Maintainer: ASHIR Tech <tech@ashir.tech>
Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libglib2.0-0, librsvg2-2, libssl3
Description: ADTP Desktop — Agent Direct Transfer Protocol
 A secure peer-to-peer file transfer desktop application
 with encrypted QUIC transport, audit chains, and mobile companion support.
EOF

          # Build .deb
          dpkg-deb --build "$PKG_DIR" "adtp-desktop_${PKG_VERSION}_${PKG_ARCH}.deb"

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: adtp-deb-linux
          path: adtp-desktop_1.0.0_amd64.deb

  # ── 5. Build Windows .exe ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop

      - name: Package .exe
        run: |
          mkdir -p dist/windows
          Copy-Item "target/release/adtp-desktop.exe" "dist/windows/adtp-desktop.exe"

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: adtp-exe-windows
          path: dist/windows/adtp-desktop.exe

  # ── 6. Create a GitHub Release for this commit ────────────────────────
  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release files
        run: |
          echo "=== Artifacts directory ==="
          find artifacts -type f 2>/dev/null || echo "No artifacts found"
          mkdir -p release
          cp artifacts/adtp-desktop_1.0.0_amd64.deb release/ 2>/dev/null || true
          cp artifacts/adtp-desktop.exe release/ 2>/dev/null || true
          echo "=== Release files ==="
          ls -lh release/

      - name: Create release tag for this commit
        id: tag
        run: |
          TAG="mars-v1-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          # Mars v1.0.0 — ADTP Desktop Release

          ## Overview

          ADTP (Agent Direct Transfer Protocol) Desktop — a secure peer-to-peer file
          transfer desktop application with encrypted QUIC transport, cryptographic
          audit chains, Trust-On-First-Use TLS verification, and mobile companion
          (MARS) pairing support.

          Built from branch **${{ github.ref_name }}**.

          ## Commit

          ${{ github.event.head_commit.message }}

          Author: ${{ github.event.head_commit.author.name }}

          ## Installation

          ### Linux (.deb)

          ```bash
          sudo dpkg -i adtp-desktop_1.0.0_amd64.deb
          sudo apt-get install -f  # install dependencies if needed
          ```

          ### Windows (.exe)

          Download `adtp-desktop.exe` and run it. No installation required.

          ## Assets

          | Platform | File |
          |----------|------|
          | Linux | `adtp-desktop_1.0.0_amd64.deb` |
          | Windows | `adtp-desktop.exe` |

          ## Security

          All dependencies audited with `cargo audit`. Vulnerable dependencies
          are pinned to patched versions.

          ---

          *Automated release created by the ADTP Build & Release workflow.*
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mars v1.0.0
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: false
