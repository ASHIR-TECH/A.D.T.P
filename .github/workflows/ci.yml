name: Build & Release ADTP

on:
  push:
    branches: [main, Phase-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write
  security-events: write

# One build+release run per ref at a time; do not cancel so in-flight commits
# still ship their own release.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────
  lint:
    name: Lint & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. Run unit / integration tests ───────────────────────────────────
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

  # ── 3. Dependency & vulnerability audit ───────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Rust dependencies)
        run: cargo audit

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # ── 4. Build Linux installers ─────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clear stale glib cache
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-* target/release/build/glib-sys-* target/release/build/glib-*

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build --bundles deb,appimage,rpm
        working-directory: desktop/src-tauri

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installers-Linux
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  # ── 5. Build Windows installer ────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build --bundles msi
        working-directory: desktop/src-tauri

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-Windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ── 6. Smoke-test the built CLI binary ────────────────────────────────
  smoke-test:
    name: Smoke-test CLI binary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Verify Linux CLI binary runs (--help)
        run: |
          BIN=$(find artifacts/adtp-installers-Linux -name adtp -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "::warning::No CLI binary found in Linux artifacts; skipping execution test."
            exit 0
          fi
          "$BIN" --help

  # ── 7. Create a GitHub Release for this commit (Windows + Linux) ──────
  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/adtp-installers-Linux/deb/*.deb release/ 2>/dev/null || true
          cp artifacts/adtp-installers-Linux/appimage/*.AppImage release/ 2>/dev/null || true
          cp artifacts/adtp-installers-Linux/rpm/*.rpm release/ 2>/dev/null || true
          cp artifacts/adtp-installer-Windows/*.msi release/ 2>/dev/null || true
          echo "=== Release files ==="
          ls -lh release/

      - name: Create release tag for this commit
        id: tag
        run: |
          TAG="build-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          # ADTP Build — ${{ github.sha }}

          Built from branch **${{ github.ref_name }}**.

          ## Commit
          ${{ github.event.head_commit.message }}

          Author: ${{ github.event.head_commit.author.name }}

          ## Assets

          **Linux**
          - ADTP Desktop (.deb)
          - ADTP Desktop (.rpm)
          - ADTP Desktop (AppImage)

          **Windows**
          - ADTP Desktop (.msi)

          > Automated release created by the Build & Release workflow on every push.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ADTP Build ${{ github.sha }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: true
          generate_release_notes: false
