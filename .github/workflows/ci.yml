name: Build & Release ADTP

on:
  push:
    branches: [main, Phase-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write
  security-events: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────
  lint:
    name: Lint & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev libssl-dev patchelf libayatana-appindicator3-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. Run unit / integration tests ───────────────────────────────────
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev libssl-dev patchelf libayatana-appindicator3-dev
      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

  # ── 3. Dependency & vulnerability audit ───────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit (Rust dependencies)
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2024-0429 \
            --ignore spin \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0194 || true

  # ── 4. Build Linux .deb package ─────────────────────────────────────────
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev libssl-dev patchelf libayatana-appindicator3-dev dpkg-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop
      - name: Package as .deb with desktop entry and icons
        run: |
          PKG_DIR="dist/linux-deb"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$PKG_DIR/usr/share/pixmaps"

          # Binary
          cp target/release/adtp-desktop "$PKG_DIR/usr/bin/adtp-desktop"
          chmod 755 "$PKG_DIR/usr/bin/adtp-desktop"

          # Icons
          cp desktop/src-tauri/icons/32x32.png "$PKG_DIR/usr/share/icons/hicolor/32x32/apps/adtp-desktop.png"
          cp desktop/src-tauri/icons/64x64.png "$PKG_DIR/usr/share/icons/hicolor/64x64/apps/adtp-desktop.png"
          cp desktop/src-tauri/icons/128x128.png "$PKG_DIR/usr/share/icons/hicolor/128x128/apps/adtp-desktop.png"
          cp desktop/src-tauri/icons/128x128@2x.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/adtp-desktop.png"
          cp desktop/src-tauri/icons/128x128.png "$PKG_DIR/usr/share/pixmaps/adtp-desktop.png"

          # Desktop entry (app menu / launcher)
          printf '[Desktop Entry]\nType=Application\nName=ADTP Desktop\nComment=Agent Direct Transfer Protocol - secure P2P file transfer\nExec=/usr/bin/adtp-desktop\nIcon=adtp-desktop\nTerminal=false\nCategories=Network;FileTransfer;\nKeywords=adtp;transfer;p2p;file;ashir;\nStartupNotify=true\n' > "$PKG_DIR/usr/share/applications/adtp-desktop.desktop"

          # Control file
          printf 'Package: adtp-desktop\nVersion: 1.0.0\nSection: net\nPriority: optional\nArchitecture: amd64\nMaintainer: ASHIR Tech <tech@ashir.tech>\nDepends: libgtk-3-0, libwebkit2gtk-4.1-0, libglib2.0-0, librsvg2-2, libssl3\nDescription: ADTP Desktop - Agent Direct Transfer Protocol\n A secure peer-to-peer file transfer desktop application\n with encrypted QUIC transport, audit chains, and mobile companion support.\n' > "$PKG_DIR/DEBIAN/control"

          # Post-install: refresh desktop + icon caches so the app appears immediately
          printf '#!/bin/sh\nset -e\nif command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database -q /usr/share/applications; fi\nif command -v gtk-update-icon-cache >/dev/null 2>&1; then gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true; fi\nexit 0\n' > "$PKG_DIR/DEBIAN/postinst"
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          dpkg-deb --build "$PKG_DIR" "adtp-desktop_1.0.0_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: adtp-deb-linux
          path: adtp-desktop_1.0.0_amd64.deb

  # ── 5. Build Windows .exe ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop binary (release)
        run: cargo build --release --bin adtp-desktop
      - name: Package .exe
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Path target/release/adtp-desktop.exe -Destination dist/windows/adtp-desktop.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: adtp-exe-windows
          path: dist/windows/adtp-desktop.exe

  # ── 6. Create a GitHub Release for this commit ────────────────────────
  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage release files
        run: |
          echo "=== Artifacts directory ==="
          find artifacts -type f 2>/dev/null || echo "No artifacts found"
          mkdir -p release
          cp artifacts/adtp-desktop_1.0.0_amd64.deb release/ 2>/dev/null || true
          cp artifacts/adtp-desktop.exe release/ 2>/dev/null || true
          echo "=== Release files ==="
          ls -lh release/
      - name: Create release tag for this commit
        id: tag
        run: |
          TAG="mars-v1-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Generate release notes
        run: |
          printf '# Mars v1.0.0 - ADTP Desktop Release\n\n## Overview\n\nADTP (Agent Direct Transfer Protocol) Desktop - a secure peer-to-peer file transfer desktop application with encrypted QUIC transport, cryptographic audit chains, Trust-On-First-Use TLS verification, and mobile companion (MARS) pairing support.\n\nBuilt from branch **%s**.\n\n## Commit\n\n%s\n\nAuthor: %s\n\n## Installation\n\n### Linux (.deb)\n\n```bash\nsudo dpkg -i adtp-desktop_1.0.0_amd64.deb\nsudo apt-get install -f\n```\n\n### Remove ADTP Desktop (Linux)\n\n```bash\nsudo apt remove adtp-desktop\n```\n\n### Windows (.exe)\n\nDownload `adtp-desktop.exe` and run it. No installation required.\n\n## Assets\n\n| Platform | File |\n|----------|------|\n| Linux | `adtp-desktop_1.0.0_amd64.deb` |\n| Windows | `adtp-desktop.exe` |\n\n## Security\n\nAll dependencies audited with `cargo audit`.\n\n---\n\n*Automated release created by the ADTP Build & Release workflow.*\n' "${GITHUB_REF_NAME}" "${{ github.event.head_commit.message }}" "${{ github.event.head_commit.author.name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mars v1.0.0
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: false
