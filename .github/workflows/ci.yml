name: CI — ADTP

on:
  push:
    branches: [main, Phase-*]
    tags: ["v*"]
  pull_request:
    branches: [main, Phase-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────
  lint:
    name: Lint & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. Run unit / integration tests ───────────────────────────────────
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

  # ── 3. Dependency & vulnerability audit ───────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Rust dependencies)
        run: cargo audit

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # ── 4. Build desktop installers ───────────────────────────────────────
  build-desktop:
    name: Build desktop ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [lint, test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: Linux
            os: ubuntu-24.04
            bundle: --bundles deb,appimage,rpm
          - suffix: Windows
            os: windows-2025
            bundle: --bundles msi
          - suffix: macOS
            os: macos-14
            bundle: --bundles dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        if: matrix.suffix == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libssl-dev patchelf \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clear stale glib cache
        if: matrix.suffix == 'Linux'
        run: rm -rf target/debug/build/glib-sys-* target/debug/build/glib-* target/release/build/glib-sys-* target/release/build/glib-*

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: cargo install tauri-cli --version "^2"
      - run: npm ci
        working-directory: desktop
      - run: cargo tauri build ${{ matrix.bundle }}
        working-directory: desktop/src-tauri

      - name: Upload installers (Linux)
        if: matrix.suffix == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installers-${{ matrix.suffix }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn

      - name: Upload installer (Windows)
        if: matrix.suffix == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-${{ matrix.suffix }}
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload installer (macOS)
        if: matrix.suffix == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: adtp-installer-${{ matrix.suffix }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── 5. Smoke-test built CLI binary ────────────────────────────────────
  smoke-test:
    name: Smoke-test CLI binary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Verify CLI binary runs (--help)
        run: |
          # The Linux build job uploads the full bundle dir; find the binary.
          BIN=$(find artifacts/adtp-installers-Linux -name adtp -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "::warning::No CLI binary found in artifacts; skipping execution test."
            exit 0
          fi
          "$BIN" --help

  # ── 6. Publish GitHub release (tags only) ─────────────────────────────
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, smoke-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # Linux
          cp artifacts/adtp-installers-Linux/deb/*.deb release/ 2>/dev/null || true
          cp artifacts/adtp-installers-Linux/appimage/*.AppImage release/ 2>/dev/null || true
          cp artifacts/adtp-installers-Linux/rpm/*.rpm release/ 2>/dev/null || true
          # Windows
          cp artifacts/adtp-installer-Windows/msi/*.msi release/ 2>/dev/null || true
          # macOS
          cp artifacts/adtp-installer-macOS/dmg/*.dmg release/ 2>/dev/null || true
          ls -lh release/

      - name: Generate release notes
        run: |
          cat > notes.md <<'EOF'
          ## ADTP Desktop ${{ github.ref_name }}

          Attached are the installers for various OS. Most builds are untested
          and should be validated before releasing to the general public.

          **For Linux**
          - ADTP Desktop (.deb)
          - ADTP Desktop (.rpm)
          - ADTP Desktop (AppImage)

          **For Windows**
          - ADTP Desktop (.msi)

          **For macOS**
          - ADTP Desktop (.dmg)
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADTP ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
