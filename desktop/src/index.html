<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADTP — Ashir Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="orb-stage">
    <div class="orb-ambient orb-center"></div>
    <svg id="orbRingsBack" class="orb-rings-svg" viewBox="-120 -120 240 240"></svg>
    <div class="orb-globe orb-center">
      <div class="orb-spin"></div>
      <div class="orb-limb"></div>
      <div class="orb-corona"></div>
    </div>
    <svg id="orbRingsFront" class="orb-rings-svg" viewBox="-120 -120 240 240"></svg>
  </div>
  <div id="app">
    <nav id="sidebar"></nav>
    <div id="content">
      <div id="banner-container"></div>
      <div id="page-container"></div>
    </div>
  </div>
  <div id="toast-container"></div>
  <div id="toast-container-top"></div>
  <script src="lib/qrcode-bundle.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
